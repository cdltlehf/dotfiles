#:schema https://www.schemastore.org/prek.json

default_install_hook_types = [
  "commit-msg",
  "post-checkout",
  "post-commit",
  "post-merge",
  "post-rewrite",
  "pre-commit",
  "pre-merge-commit",
  "pre-push",
  "pre-rebase",
  "prepare-commit-msg",
]
default_stages = ["pre-commit"]

[[repos]]
hooks = [
  { id = "check-added-large-files" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "no-commit-to-branch" },
]
repo = "builtin"

[[repos]]
hooks = [{ id = "shfmt", types_or = ["shell", "bats"] }]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"

[[repos.hooks]]
exclude = '\.zsh$'
id = "shellcheck"
types_or = ["shell", "bats"]

[[repos]]
hooks = [{ id = "yamllint" }]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"

[[repos]]
hooks = [{ id = "markdownlint-cli2", args = ["--fix"] }]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.24.0"

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.6.4"

[[repos.hooks]]
additional_dependencies = ["@biomejs/biome@2.6.4"]
id = "biome-format"
types_or = ["javascript", "json", "jsx", "ts", "tsx"]

[[repos]]
hooks = [{ id = "gitleaks" }]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos]]
hooks = [
  { id = "commitizen" },
  { id = "commitizen-branch", stages = [
    "pre-push",
  ] },
]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.19.3"

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.26.0"

[[repos.hooks]]
args = ["--output=line"]
id = "vale"
