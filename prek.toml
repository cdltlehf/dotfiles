#:schema https://www.schemastore.org/prek.json

default_install_hook_types = [
  "commit-msg",
  "post-checkout",
  "post-commit",
  "post-merge",
  "post-rewrite",
  "pre-commit",
  "pre-merge-commit",
  "pre-push",
  "pre-rebase",
  "prepare-commit-msg",
]
default_stages = ["pre-commit"]

[[repos]]
repo = "local"
[[repos.hooks]]
entry = "lua-language-server --check . --checklevel=Information"
id = "lua-language-server"
language = "system"
name = "lua-language-server"
pass_filenames = false
types = ["lua"]

[[repos]]
repo = "local"
[[repos.hooks]]
entry = "taplo check"
id = "taplo-check"
language = "system"
name = "taplo check"
pass_filenames = false
types = ["toml"]
[[repos.hooks]]
entry = "taplo fmt"
id = "taplo-format"
language = "system"
name = "taplo fmt"
types = ["toml"]

[[repos]]
repo = "builtin"
[[repos.hooks]]
id = "check-added-large-files"
[[repos.hooks]]
id = "check-executables-have-shebangs"
[[repos.hooks]]
id = "check-json"
[[repos.hooks]]
id = "check-merge-conflict"
[[repos.hooks]]
id = "check-symlinks"
[[repos.hooks]]
id = "destroyed-symlinks"
[[repos.hooks]]
id = "end-of-file-fixer"
[[repos.hooks]]
id = "trailing-whitespace"
[[repos.hooks]]
args = ["--branch", "main", "--branch", "develop"]
id = "no-commit-to-branch"

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
[[repos.hooks]]
id = "shfmt"
types_or = ["shell", "bats"]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
[[repos.hooks]]
exclude = '\.zsh$'
id = "shellcheck"
types_or = ["shell", "bats"]

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.6.0"
[[repos.hooks]]
id = "stylua-github"

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
[[repos.hooks]]
id = "yamllint"

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.3"
[[repos.hooks]]
args = ["--fix"]
id = "markdownlint-cli2"

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.15"
[[repos.hooks]]
additional_dependencies = ["@biomejs/biome@2.5.14"]
id = "biome-format"
types_or = ["javascript", "json", "jsx", "ts", "tsx"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.19.2"
[[repos.hooks]]
id = "commitizen"
[[repos.hooks]]
id = "commitizen-branch"
stages = ["pre-push"]

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.25.1"
[[repos.hooks]]
args = ["sync"]
id = "vale"
name = "vale sync"
pass_filenames = false
[[repos.hooks]]
args = ["--output=line", "--minAlertLevel=error"]
id = "vale"
