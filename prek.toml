#:schema https://www.schemastore.org/prek.json

default_install_hook_types = [
  "commit-msg",
  "post-checkout",
  "post-commit",
  "post-merge",
  "post-rewrite",
  "pre-commit",
  "pre-merge-commit",
  "pre-push",
  "pre-rebase",
  "prepare-commit-msg",
]
default_stages = ["pre-commit"]

[[repos]]
hooks = [
  { id = "check-added-large-files" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "no-commit-to-branch", args = [
    "--branch",
    "main",
    "--branch",
    "develop",
  ] },
]
repo = "builtin"

[[repos]]
hooks = [{ id = "shfmt", types_or = ["shell", "bats"] }]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"

[[repos.hooks]]
exclude = '\.zsh$'
id = "shellcheck"
types_or = ["shell", "bats"]

[[repos]]
hooks = [{ id = "stylua-github" }]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.6.0"

[[repos]]
hooks = [{ id = "yamllint" }]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"

[[repos]]
hooks = [{ id = "markdownlint-cli2", args = ["--fix"] }]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.3"

# TODO: Pin these tools in xdg-config-home/mise/config.toml. On macOS they
# come from Homebrew unpinned, so their versions differ from Linux.
[[repos]]
repo = "local"

[[repos.hooks]]
entry = "lua-language-server --check . --checklevel=Information"
id = "lua-language-server"
language = "system"
name = "lua-language-server"
pass_filenames = false
types = ["lua"]

[[repos.hooks]]
entry = "taplo check"
id = "taplo-check"
language = "system"
name = "taplo check"
pass_filenames = false
types = ["toml"]

[[repos.hooks]]
entry = "taplo fmt"
id = "taplo-format"
language = "system"
name = "taplo fmt"
types = ["toml"]

# Biome indents continuation lines by 2 spaces, not by the 4 or more of
# the Google JavaScript Style Guide, and cannot be configured to.
[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.15"

[[repos.hooks]]
additional_dependencies = ["@biomejs/biome@2.5.14"]
id = "biome-format"
types_or = ["javascript", "json", "jsx", "ts", "tsx"]

[[repos]]
hooks = [{ id = "gitleaks" }]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos]]
hooks = [
  { id = "commitizen" },
  { id = "commitizen-branch", stages = [
    "pre-push",
  ] },
]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.19.2"
