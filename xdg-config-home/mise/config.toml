# Reference: https://mise.jdx.dev/configuration.html

# Tools that need the same version on every platform, such as language
# runtimes and the tools that projects and hooks depend on.

[tools]
java = "27"
"npm:@colbymchenry/codegraph" = "1.6.2"
"npm:@earendil-works/pi-coding-agent" = "1.3.0"
"npm:markdownlint-lsp" = "0.10.0"
"npm:vim-language-server" = "2.3.1"
"npm:vscode-html-languageserver-bin" = "1.4.0"
"pipx:commitizen" = "4.19.2"
"pipx:huggingface_hub" = "2.2.0"
"pipx:huggingface_hub[cli]" = "1.29.0"
prek = "0.5.6"
python = "3.15.0"
tinytex = "2026.10"
ty = "0.0.89"
"ubi:vale-cli/vale-ls" = "latest"
