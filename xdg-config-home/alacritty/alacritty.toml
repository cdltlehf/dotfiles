import = ["~/.local/state/alacritty/colors.toml"]

[env]
LC_TERMINAL_GLYPHS = "nerdfont"

[window]
blur = true
decorations = "Transparent"
opacity = 0.9

[font]
bold = { family = "JetBrains Mono", style = "Bold" }
bold_italic = { family = "Victor Mono", style = "Bold Italic" }
italic = { family = "Victor Mono", style = "Medium Italic" }
normal = { family = "JetBrains Mono" }
offset = { x = 0, y = 2 }
size = 13

[keyboard]
bindings = [{ key = "Key6", mods = "Control", chars = "\u001e" }]
