# Reference: https://sw.kovidgoyal.net/kitty/conf/

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      Victor Mono Medium Italic
bold_italic_font Victor Mono Bold Italic
font_size        13.0
modify_font cell_height 120%

symbol_map U+0370-U+03FF,U+2070-U+209F,U+2100-U+214F,U+2150-U+218F,U+2190-U+21FF,U+2200-U+22FF,U+2300-U+23FF,U+2460-U+24FF,U+25A0-U+25FF,U+27C0-U+27EF,U+27F0-U+27FF,U+2800-U+28FF,U+2900-U+297F,U+2980-U+29FF,U+2A00-U+2AFF,U+2B00-U+2BFF,U+1D400-U+1D7FF JuliaMono

hide_window_decorations titlebar-only
macos_titlebar_color    background
background_opacity      0.9
background_blur         30

env LC_TERMINAL_GLYPHS=nerdfont

include ~/.local/state/kitty/colors.conf
