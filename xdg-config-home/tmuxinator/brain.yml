# /Users/cdltlehf/.config/tmuxinator/brain.yml

name: brain
root: ~/
attach: false

windows:
  - hermes:
      panes:
        - hermes: >
            hermes gateway run --replace
        - hermes-dashboard:9119: >
            hermes dashboard --no-open --insecure
  - odysseus:7860: >
      ODYSSEUS_NO_OPEN=1
      ${HOME}/projects/odysseus/start-macos.sh
  - llama-server:8080: >
      llama serve \
        --ui-mcp-proxy \
        --ui-config-file "${HOME}/.config/llama/ui_config.json" \
        --cache-type-k "q4_0" \
        --cache-type-v "q4_0" \
        --lookup-cache-dynamic \
          "${HOME}/.cache/llama/lookup_cache_dynamic.bin" \
        --lookup-cache-static \
          "${HOME}/.cache/llama/lookup_cache_static.bin" \
        --tools all
  - mcp:8000: >
      uvx mcp-proxy \
        --named-server-config "${XDG_CONFIG_HOME:-$HOME/.config}/mcp/config.json" \
        --port 8000 \
        --stateless
