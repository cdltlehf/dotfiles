services:
  whisper-server:
    build:
      context: .
      dockerfile: Containerfile
    image: local/whisper-server-krunkit:latest
    container_name: whisper-server
    restart: unless-stopped
    profiles:
      - audio
      - whisper
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/models/audio:/models:ro
    command: [
      "--model", "/models/${SELFHOST_AUDIO_MODEL:-audio.bin}",
      "--language", "auto",
      "--host", "0.0.0.0"
    ]
