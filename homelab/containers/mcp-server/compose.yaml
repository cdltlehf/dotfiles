services:
  mcp-server:
    build:
      context: .
      dockerfile: Containerfile
    image: local/mcp-server:latest
    container_name: mcp-server
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=gateway,mcp-server,${SELFHOST_MCP_ALLOWED_HOSTS:-}
      - PUBLIC_URL=${SELFHOST_MCP_PUBLIC_URL:-}
      - IMAGE_DIR=/data/images
      - AUDIO_DIR=/data/audio
      - SPEECH_MODEL=${SELFHOST_SPEECH_MODEL:-}
      - MCP_ENABLE_IMAGE=${SELFHOST_IMAGE_MODEL:+1}
      - MCP_ENABLE_AUDIO=${SELFHOST_AUDIO_MODEL:+1}
      - MCP_ENABLE_SPEECH=${SELFHOST_SPEECH_MODEL:+1}
      - IMAGE_BASE_URL=http://sd-server:1234/v1
      - OPENAI_BASE_URL=http://gateway:8000/v1
      - OPENAI_API_KEY=${SELFHOST_API_KEY:?SELFHOST_API_KEY is required}
      - IMAGE_DEFAULT_POSITIVE_PROMPT=${SELFHOST_MCP_IMAGE_POSITIVE_PROMPT:-}
      - IMAGE_DEFAULT_NEGATIVE_PROMPT=${SELFHOST_MCP_IMAGE_NEGATIVE_PROMPT:-}
    volumes:
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/mcp-server/images:/data/images:rw
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/mcp-server/audio:/data/audio:rw
    profiles:
      - mcp
    depends_on:
      sd-server:
        condition: service_started
        required: false
      whisper-server:
        condition: service_started
        required: false
      llama-speech-server:
        condition: service_started
        required: false
