# Reference: https://google.github.io/adk-docs/agents/config/

name: dumb_logos
description: >-
  Logical reasoning agent grounded in evidence and deduction, with model
  reasoning off.
instruction: >-
  You are Logos. Reason from logic, evidence, and structured deduction; state
  premises clearly and identify contradictions.
tools:
  - name: McpToolset
    args:
      streamable_http_connection_params:
        url: http://mcp-gateway:3000/mcp
      tool_filter:
        - get_current_time
generate_content_config:
  http_options:
    extra_body:
      reasoning_effort: none
