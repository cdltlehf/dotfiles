services:
  a2a:
    build:
      context: .
      dockerfile: Containerfile
    image: local/a2a:latest
    container_name: a2a
    restart: unless-stopped
    profiles:
      - a2a
    environment:
      - PUBLIC_URL=${SELFHOST_A2A_PUBLIC_URL:-http://localhost:9999}
      - "OPENAI_API_KEY=${SELFHOST_A2A_LLM_API_KEY:-\
        ${SELFHOST_API_KEY:?SELFHOST_API_KEY is required}}"
      - OPENAI_API_BASE=${SELFHOST_A2A_LLM_BASE_URL:-http://gateway:8000/v1}
    volumes:
      - ./agents:/app/agents-src:ro
    command:
      - "--default_llm_model"
      - "${SELFHOST_A2A_LLM_PROVIDER:-openai}/${SELFHOST_A2A_LLM_MODEL:-${SELFHOST_RESPONSES_MODEL:-default}}"
      - "/app/agents"
