services:
  gateway:
    image: docker.io/library/caddy:alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:9999:9999"
    environment:
      - API_KEY=${SELFHOST_API_KEY:?SELFHOST_API_KEY is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      llama-server:
        condition: service_started
        required: false
      llama-embedding-server:
        condition: service_started
        required: false
      llama-speech-server:
        condition: service_started
        required: false
      whisper-server:
        condition: service_started
        required: false
      sd-server:
        condition: service_started
        required: false
      mcp-server:
        condition: service_started
        required: false
      a2a:
        condition: service_started
        required: false
