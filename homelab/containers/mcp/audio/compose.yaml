services:
  mcp-audio:
    build:
      context: .
      dockerfile: Containerfile
    image: local/mcp-audio:latest
    container_name: mcp-audio
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=gateway,mcp-audio,${SELFHOST_MCP_ALLOWED_HOSTS:-}
      - AUDIO_DIR=/data/audio
      - PUBLIC_URL=${SELFHOST_MCP_PUBLIC_URL:-}
      - SPEECH_MODEL=${SELFHOST_SPEECH_MODEL:-default}
      - OPENAI_BASE_URL=http://gateway:8000/v1
      - OPENAI_API_KEY=${SELFHOST_API_KEY:?SELFHOST_API_KEY is required}
    volumes:
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/mcp-server/audio:/data/audio:rw
    profiles:
      - audio
    depends_on:
      whisper-server:
        condition: service_started
        required: false
      llama-speech-server:
        condition: service_started
        required: false
