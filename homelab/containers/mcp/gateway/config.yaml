# yamllint disable rule:line-length
# Reference: https://agentgateway.dev/docs/standalone/latest/documentation/configuration/overview/
# Reference: https://agentgateway.dev/docs/standalone/latest/integrations/mcp/servers/virtual/
# yamllint enable rule:line-length

mcp:
  port: 3000
  # Keep serving the other targets' tools while one is down or its profile
  # is off; the default, failClosed, fails every session instead.
  failureMode: failOpen
  # The tools keep no per-session state, so sessions need not be tracked.
  statefulMode: stateless
  policies:
    timeout:
      requestTimeout: 60s
      backendRequestTimeout: 60s
  targets:
    - name: mcp-image
      mcp:
        host: http://mcp-image:8000/mcp
    - name: mcp-audio
      mcp:
        host: http://mcp-audio:8000/mcp
    - name: mcp-web
      mcp:
        host: http://mcp-web:8000/mcp
