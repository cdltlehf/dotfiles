Packages = Google
Grammars = python

[*.{py,md,markdown}]
BasedOnStyles = Google

TokenIgnores = (\b(?:MUST NOT|MUST|SHALL NOT|SHALL|SHOULD NOT|SHOULD|NOT RECOMMENDED|RECOMMENDED|REQUIRED|MAY|OPTIONAL)\b)

[docs/decisions/**]
Google.Headings = NO

# Google docstrings capitalize after the colon.
[*.py]
Google.Colons = NO

[xdg-templates-dir/madr/**]
BasedOnStyles =
