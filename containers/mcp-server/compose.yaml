# Reference: https://compose-spec.io/

services:
  mcp-server:
    build:
      context: .
      dockerfile: Containerfile
    image: local/mcp-server:latest
    container_name: mcp-server
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=gateway,${ALLOWED_HOSTS:-}
      - MCP_BASE_URL=${MCP_BASE_URL:-http://localhost:8001}
      - OPENAI_BASE_URL=http://gateway:8000/v1
      - OPENAI_API_KEY=${API_KEY:?API_KEY is required}
      - AUDIO_MODEL=${AUDIO_MODEL:?AUDIO_MODEL is required}
      - IMAGE_DEFAULT_POSITIVE_PROMPT=${IMAGE_DEFAULT_POSITIVE_PROMPT:-}
      - IMAGE_DEFAULT_NEGATIVE_PROMPT=${IMAGE_DEFAULT_NEGATIVE_PROMPT:-}
    profiles:
      - mcp
    depends_on:
      sd-server:
        condition: service_started
        required: false
      whisper-server:
        condition: service_started
        required: false
