# Reference: https://compose-spec.io/

services:
  a2a:
    build:
      context: .
      dockerfile: Containerfile
    image: local/a2a:latest
    container_name: a2a
    restart: unless-stopped
    profiles:
      - a2a
    environment:
      - OPENAI_API_KEY=${COMPOSE_API_KEY:?COMPOSE_API_KEY is required}
      - OPENAI_API_BASE=${LLM_BASE_URL:-http://gateway:8000/v1}
    volumes:
      - ./agents:/app/agents:ro
    command:
      - "--default_llm_model"
      - "openai/${RESPONSES_MODEL:-default}"
      - "/app/agents"
