services:
  llama-server:
    build:
      context: .
      dockerfile: Containerfile
    image: local/llama-server-krunkit:latest
    container_name: llama-server
    restart: unless-stopped
    profiles:
      - responses
      - llama
    devices:
      - /dev/dri:/dev/dri
    environment:
      - LLAMA_API_KEY=${API_KEY:?API_KEY is required}
    volumes:
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/models/responses:/models:ro
    command: [
      "--cache-type-k", "q4_0",
      "--cache-type-v", "q4_0",
      "--ctx-size", "16384",
      "--host", "0.0.0.0",
      "--metrics",
      "--models-dir", "/models",
      "--models-max", "1",
      "--parallel", "1",
      "--sleep-idle-seconds", "300",
      "--ubatch-size", "512",
    ]

  llama-embedding-server:
    image: local/llama-server-krunkit:latest
    container_name: llama-embedding-server
    restart: unless-stopped
    profiles:
      - embeddings
      - llama-embedding
    devices:
      - /dev/dri:/dev/dri
    environment:
      - LLAMA_API_KEY=${API_KEY:?API_KEY is required}
    volumes:
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/models/embeddings:/models:ro
    command: [
      "--host", "0.0.0.0",
      "--models-dir", "/models",
      "--models-max", "1",
      "--ctx-size", "2048",
      "--ubatch-size", "2048",
      "--sleep-idle-seconds", "300",
      "--embeddings",
    ]
