services:
  pi:
    build:
      context: .
      dockerfile: Containerfile
    image: local/pi:latest
    container_name: pi
    restart: unless-stopped
    profiles:
      - pi
      - sandbox
    environment:
      - LLAMA_BASE_URL=http://gateway:8000
      - LLAMA_API_KEY=${API_KEY:?API_KEY is required}
      - API_KEY=${API_KEY:?API_KEY is required}
    volumes:
      - ${XDG_DATA_HOME:-${HOME}/.local/share}/sandbox:/workspace:rw
      - ./settings.json:/root/.config/pi/agent/settings.json:ro
      - ./mcp.json:/root/.config/pi/agent/mcp.json:ro
