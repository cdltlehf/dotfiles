# tmux-in-tmux
# prefix C-x to disable outmost tmux, C-x C-x to enable it.

bind-key C-x \
    set-option key-table disabled\; \
    set-option prefix None\; \
    set-option status-left "#[bg=${selection},fg=${foreground}] #{session_name}[D] "\; \
    set-option status-right "#[bg=${selection},fg=${foreground}] #{=19:pane_title} "\; \
    set-option window-status-current-format "#[bg=${background},fg=${comment}] #I #W#{window_flags} "\; \
    set-option status-interval 0\;

# set-option -g status-right \
"#[bg=${cyan},fg=${background}] #{=22:pane_title} \
#[bg=${orange},fg=${background}] %H:%M %d-%b-%y "

bind-key -T disabled C-x switch-client -T _disabled\; \
    set-option status-left "#[bg=${background},fg=${comment}] #{session_name}[D] "\;

bind-key -T _disabled C-x \
    set-option -u key-table\; \
    set-option -u prefix\; \
    set-option -u status-left\; \
    set-option -u status-right\; \
    set-option -u window-status-current-format\; \
    set-option -u status-interval\;

