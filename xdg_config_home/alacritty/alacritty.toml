import = [ "~/.cache/wal/colors-alacritty.toml" ]

[window]
padding =  { x = 0, y = 25 }
dimensions = { columns = 80, lines = 24 }
decorations = "Transparent"
opacity = 0.95
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font" , style = "Regular" }
size = 13
offset = { x = 0, y = 2 }

[keyboard]
bindings = [
  { key = "Key6", mods = "Control", chars = "\u001e" }
]
