# Set prefix (C-a) {{{1
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key -T root C-b display-message "You are using C-a as a prefix."

# Dracula Color Pallette {{{1
# https://spec.draculatheme.com/
background='#282a36'
foreground='#f8f8f2'
selection='#44475a'
comment='#6272a4'

red='#ff5555'
orange='#ffb86c'
yellow='#f1fa8c'
green='#50fa7b'
purple='#bd93f9'
cyan='#8be9fd'
pink='#ff79c6'

# Set border style {{{1
set-option -g pane-active-border-style "fg=${purple}"
set-option -g pane-border-style "fg=${selection}"

# Set message, status style {{{1
set-option -g message-style "bg=${selection},fg=${foreground}"
set-option -g status-style "bg=${selection},fg=${foreground}"
set-option -g status-interval 6

# Set status-left {{{1
set-option -g status-left-length 100
set-option -g status-left \
  "#[bg=#{?client_prefix,${yellow},${green}},fg=${background}]"
set-option -ag status-left " #{session_name} "

# Set window-status {{{1
set-option -g window-status-current-format \
  "#[bg=${background},fg=${foreground}] #I #W#F "
set-option -g window-status-format \
  "#[bg=${selection},fg=${foreground}] #I #W#F "
set-option -g window-status-separator ''

set-option -g window-status-activity-style "bold"
set-option -g window-status-bell-style "bold"

# Set status-right {{{1
set-option -g status-right-length 100
set-option -g status-right "#[bg=${cyan},fg=${background}] #{pane_title} "
set-option -ag status-right "#[bg=${orange},fg=${background}] %H:%M %Y-%m-%d "

# Set server options {{{1
set-option -s escape-time 0

# Set global session options {{{1
set-option -g history-limit 50000
set-option -g base-index 1
set-option -g renumber-windows on
set-option -g pane-base-index 1

# Set terminal. See the following post {{{1
# https://medium.com/@dubistkomisch/how-to-actually-get-italics-and-true-colour-to-work-in-iterm-tmux-vim-9ebe55ebc2be
set-option -g default-terminal 'xterm-256color'
set-option -as terminal-overrides ',*256col*:Tc'
set-option -as terminal-overrides '*italic:sitm=\E[3m:ritm=\E[23m'

# Navigate pane {{{1
bind-key h select-pane -L
bind-key C-h select-pane -L
bind-key j select-pane -D
bind-key C-j select-pane -D
bind-key k select-pane -U
bind-key C-k select-pane -U
bind-key l select-pane -R
bind-key C-l select-pane -R

# Vim-like resize pane {{{1
bind-key -r - resize-pane -D 5
bind-key -r + resize-pane -U 5
bind-key -r < resize-pane -L 5
bind-key -r > resize-pane -R 5

# Resize pane {{{1
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Split window with a current path {{{1
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
# bind-key "c" new-window -c "#{pane_current_path}"

# Navigate window {{{1
bind-key C-p previous-window
bind-key C-n next-window
bind-key C-a last-window

# Vim-like visual mode {{{1
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v \
  send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key P paste-buffer
# bind-key C-r choose-buffer

# Set vi keys {{{1
set-option -g status-keys vi
set-option -g mode-keys vi

# Source file {{{1
bind-key r source-file ~/.tmux.conf \; display-message "source-file done"

# Miscellaneous key bindings {{{1
bind-key y set-window-option synchronize-panes

# Tmux-in-tmux {{{1
# C-a C-b to disable outmost tmux, C-b C-a to enable it.
bind-key C-b \
  set-option key-table disabled\; \
  set-option prefix None\; \
  \
  set-option status-left \
  "#[bg=#{?#{==:#{client_key_table},disabled},${comment},${purple}}]" \; \
  set-option -a status-left "#[fg=${background}]"\; \
  set-option -a status-left " #{session_name}[D] "\; \
  \
  set-option status-right \
  "#[bg=${comment},fg=${background}] #{pane_title} "\; \
  \
  set-option window-status-current-format \
  "#[bg=${background},fg=${comment}] #I #W#F "\; \
  \
  display-message "tmux is disabled. Press C-b C-a to enable" \; 

bind-key -T disabled C-b \
  set-option key-table _disabled

bind-key -T _disabled Escape \
  set-option key-table disabled

bind-key -T _disabled C-b \
  set-option key-table disabled

bind-key -T _disabled C-a \
  set-option -u key-table\; \
  set-option -u prefix\; \
  set-option -u status-left\; \
  set-option -u status-right\; \
  set-option -u window-status-current-format\; \
  set-option -u status-interval\; 

# }}}

