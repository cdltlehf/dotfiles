# Reference: https://compose-spec.io/
# Reference: https://platform.openai.com/docs/api-reference

services:
  gateway:
    image: docker.io/library/caddy:alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./containers/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      llama-server:
        condition: service_started
        required: false
      whisper-server:
        condition: service_started
        required: false
      sd-server:
        condition: service_started
        required: false

  llama-server:
    build:
      context: ./containers/llama-server
      dockerfile: Containerfile
    image: local/llama-server-krunkit:latest
    container_name: llama-server
    restart: unless-stopped
    profiles:
      - llama
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/.local/share/models:/models:ro
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
    environment:
      - LLAMA_ARG_MODEL=/models/${LLM_MODEL:?LLM_MODEL is required}
      - LLAMA_ARG_ALIAS=llm
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_N_PARALLEL=1
      - LLAMA_ARG_MODELS_MAX=1
      - LLAMA_ARG_SLEEP_IDLE_SECONDS=300
      - LLAMA_ARG_WEBUI_MCP_PROXY=true
      - LLAMA_ARG_TOOLS=all

  whisper-server:
    build:
      context: ./containers/whisper-server
      dockerfile: Containerfile
    image: local/whisper-server-krunkit:latest
    container_name: whisper-server
    restart: unless-stopped
    profiles:
      - whisper
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/.local/share/models:/models:ro
    command: [
      "-m", "/models/${WHISPER_MODEL:?WHISPER_MODEL is required}",
      "--host", "0.0.0.0"
    ]

  sd-server:
    build:
      context: ./containers/sd-server
      dockerfile: Containerfile
    image: local/sd-server-krunkit:latest
    container_name: sd-server
    restart: unless-stopped
    profiles:
      - sd
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/.local/share/models:/models:ro
    command: [
      "-m", "/models/${SD_MODEL:?SD_MODEL is required}",
      "--vae-tiling",
      "--listen-ip", "0.0.0.0",
      "--listen-port", "8080"
    ]
