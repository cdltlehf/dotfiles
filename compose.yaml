# Reference: https://compose-spec.io/
# Reference: https://platform.openai.com/docs/api-reference

services:
  gateway:
    image: docker.io/library/caddy:alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./containers/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      llama-server:
        condition: service_started
        required: false
      whisper-server:
        condition: service_started
        required: false
      sd-server:
        condition: service_started
        required: false

  llama-server:
    build:
      context: ./containers/llama-server
      dockerfile: Containerfile
    image: local/llama-server-krunkit:latest
    container_name: llama-server
    restart: unless-stopped
    profiles:
      - llama
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/.local/share/models/text:/models:ro
      - ~/.cache/huggingface:/root/.cache/huggingface:rw
    command: [
      "--host", "0.0.0.0",
      "--port", "8080",
      "--models-dir", "/models",
      "-c", "8192",
      "-ub", "2048",
      "-np", "1",
      "--models-max", "2",
      "--sleep-idle-seconds", "300",
      "-ctk", "q4_0",
      "-ctv", "q4_0",
      "--embeddings",
      "--ui-mcp-proxy",
      "--tools", "all"
    ]

  whisper-server:
    build:
      context: ./containers/whisper-server
      dockerfile: Containerfile
    image: local/whisper-server-krunkit:latest
    container_name: whisper-server
    restart: unless-stopped
    profiles:
      - whisper
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/.local/share/models/audio:/models:ro
    command: [
      "-m", "/models/${AUDIO_MODEL:-audio.bin}",
      "--host", "0.0.0.0"
    ]

  sd-server:
    build:
      context: ./containers/sd-server
      dockerfile: Containerfile
    image: local/sd-server-krunkit:latest
    container_name: sd-server
    restart: unless-stopped
    profiles:
      - sd
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ~/.local/share/models/image:/models:ro
    command: [
      "-m", "/models/${IMAGE_MODEL:-image.gguf}",
      "--vae-tiling",
      "--listen-ip", "0.0.0.0",
      "--listen-port", "8080"
    ]
